name: Security Checks

on:
  pull_request:
    branches: ["main", "master"]
  push:
    branches: ["main", "master"]
  schedule:
    # Run weekly on Monday at 00:00 UTC to detect newly published CVEs
    - cron: "0 0 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Cargo audit for Rust dependency vulnerabilities
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit --offline --audit-level=high

  # npm audit for Node.js dependencies (if package.json exists)
  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        if: hashFiles('**/package-lock.json') != ''

      - name: Run npm audit
        run: npm audit --audit-level=high
        if: hashFiles('**/package-lock.json') != ''

  # Secret scanning with TruffleHog
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # Static code analysis with Semgrep
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/typos
            p/rust
            p/nodejs
            p/react
          auditOn: pr

  # CodeQL Analysis for Rust
  codeql-rust:
    name: CodeQL Analysis (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust"

  # CodeQL Analysis for JavaScript/TypeScript
  codeql-javascript:
    name: CodeQL Analysis (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

  # Dependency Vulnerability Scan (combined SARIF)
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [cargo-audit, npm-audit]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run cargo audit with SARIF output
        uses: cargo-bins/cargo-audit@v0.1.28
        with:
          args: --format sarif --output cargo-audit.sarif

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: cargo-audit.sarif
          category: cargo-audit

  # Security Gate - blocks PRs with high/critical vulnerabilities
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [cargo-audit, npm-audit, secret-scan, semgrep]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit (blocking)
        run: |
          cargo audit --offline --audit-level=high
          if [ $? -ne 0 ]; then
            echo "::error::High/critical severity vulnerabilities found. PR blocked."
            exit 1
          fi

      - name: Run TruffleHog (blocking)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --exit-non-zero

      - name: Security Gate Summary
        run: echo "Security gate passed - no high/critical vulnerabilities or exposed secrets detected."
